# Sondas de recuperação normativa — ADR-075 §9, ZONA_NORMATIVA_RAG §7.2.
#
# Alvo casado por IDENTIDADE CANÔNICA da fonte (tipo|ente|órgão|número|ano) +
# ARTIGO — nunca por regex no texto. `dispositivo: null` = a fonte inteira
# (ficha, TR, manual: não articulados).
#
# status_alvo: proposto — os alvos foram escolhidos pela engenharia sobre o
# corpus de dev (22/09/2026) e AGUARDAM a Ísis validar (mesmo ciclo do corpus).
# Enquanto o catálogo inteiro está `bruto`, as sondas positivas rodam em uso
# `descoberta`; o controle de `peca` (só validado) é uma sonda negativa.
#
# Achado registrado: a OJN 06/2009 NÃO cita o art. 18 do Decreto 6.514 (o
# exemplo do §7.2 supunha isso); ela interpreta prescrição e processo — arts.
# 21, 22, 100, 101, 121 e 126. A sonda de anexo mira o que ela interpreta.

