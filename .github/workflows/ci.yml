name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────
  # BACKEND: Lint + Type check
  # ─────────────────────────────────────────────────
  backend-lint:
    name: "Backend — Lint (ruff + mypy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # requirements-dev.txt puxa requirements.txt via -r e adiciona ruff/mypy.
          # Antes o job instalava só requirements.txt → ruff/mypy ausentes →
          # "ruff: command not found" (exit 127): o lint nunca rodou de fato.
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check app/ tests/

      # Mypy é ADVISORY (non-blocking): há ~495 erros de tipagem pré-existentes
      # (sobretudo Column[int] do SQLAlchemy) que nunca foram enforçados — o job
      # morria no passo do ruff antes de chegar aqui. Corrigi-los é um refactor
      # de tipagem em massa, fora do escopo de um PR de lint. Fica como dívida
      # para correção incremental; o gate real do CI é o ruff acima.
      - name: Mypy (advisory)
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports

  # ─────────────────────────────────────────────────
  # BACKEND: Tests com PostgreSQL
  # ─────────────────────────────────────────────────
  backend-test:
    name: "Backend — Tests (PostgreSQL)"
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # dev deps trazem pytest/pytest-cov/testcontainers (ausentes do runtime).
          pip install -r requirements-dev.txt

      # O conftest sobe um Postgres via Testcontainers usando a imagem custom do
      # projeto (PostGIS + pgvector). Sem ela, o fallback é pgvector/pgvector:pg15
      # (sem PostGIS) e `CREATE EXTENSION postgis` falha. Buildamos a imagem com a
      # tag que o fixture procura (`amigao_do_meio_ambiente-db:latest`).
      - name: Build DB image (PostGIS + pgvector)
        run: docker build -t amigao_do_meio_ambiente-db:latest -f docker/db/Dockerfile .

      - name: Run tests
        env:
          SECRET_KEY: "ci-test-secret-key-with-32-chars-minimum"
          # Fernet key descartável só pro CI (ADR-014: CREDENTIAL_ENCRYPTION_KEY é
          # obrigatória, sem fallback). Não protege nada real.
          CREDENTIAL_ENCRYPTION_KEY: "Dy0Ny3uX57eV-TJv9ljrK0Vw0tzObWbI_aUekAHgMzQ="
        # TODO: Habilitar --cov-fail-under=70 quando cobertura atingir 70%
        # `python -m pytest` (não `pytest` cru): o -m insere o cwd (raiz do repo)
        # no sys.path, senão o conftest falha em `import app` (ModuleNotFoundError).
        run: python -m pytest tests/ --tb=short -q --cov=app --cov-report=term-missing

  # ─────────────────────────────────────────────────
  # BACKEND: Migration check (upgrade + downgrade)
  # ─────────────────────────────────────────────────
  backend-migrations:
    name: "Backend — Migration check"
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # As migrations criam as extensões `postgis` E `vector` (pgvector). A imagem
      # oficial postgis/postgis não tem pgvector; por isso buildamos e subimos a
      # imagem custom do projeto (PostGIS + pgvector) como container, em vez de um
      # `services:` com imagem pública incompleta.
      - name: Build DB image (PostGIS + pgvector)
        run: docker build -t amigao_do_meio_ambiente-db:latest -f docker/db/Dockerfile .

      - name: Start DB
        run: |
          docker run -d --name amigao-db \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=amigao_ci \
            -p 5432:5432 amigao_do_meio_ambiente-db:latest
          for i in $(seq 1 30); do
            if docker exec amigao-db pg_isready -U test -d amigao_ci; then break; fi
            sleep 2
          done

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migration check
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: amigao_ci
          SECRET_KEY: "ci-migration-secret-key-32-chars-min"
          CREDENTIAL_ENCRYPTION_KEY: "Dy0Ny3uX57eV-TJv9ljrK0Vw0tzObWbI_aUekAHgMzQ="
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  # ─────────────────────────────────────────────────
  # FRONTEND (Painel Interno — Vite + React)
  # ─────────────────────────────────────────────────
  frontend-ci:
    name: "Frontend — Lint + Typecheck + Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint --max-warnings=0 .

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────
  # CLIENT PORTAL (Next.js — Portal do Tenant)
  # ─────────────────────────────────────────────────
  client-portal-ci:
    name: "Client Portal — Lint + Typecheck + Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────
  # MOBILE (Expo — App de Campo)
  # ─────────────────────────────────────────────────
  mobile-ci:
    name: "Mobile — Lint + Typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo lint
        run: npx expo lint

      - name: TypeScript check
        run: npx tsc --noEmit
